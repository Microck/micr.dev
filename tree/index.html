<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tree</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <style>
      @font-face {
        font-family: "HelveticaNeue65Medium";
        src: url("fonts/Helvetica Neue 65 Medium.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(
          ellipse at bottom,
          #1b2735 0%,
          #090a0f 100%
        );
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
      }

      /* STAR BACKGROUND */
      #stars,
      #stars2,
      #stars3 {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: block;
      }

      #stars {
        width: 1px;
        height: 1px;
        background: transparent;
        box-shadow: 1234px 456px #fff, 789px 1234px #fff, 1500px 800px #fff,
          300px 1900px #fff, 1800px 300px #fff, 400px 600px #fff,
          1600px 1700px #fff, 900px 1400px #fff, 1200px 200px #fff;
        animation: animStar 50s linear infinite;
      }
      #stars:after {
        content: " ";
        position: absolute;
        top: 2000px;
        width: 1px;
        height: 1px;
        background: transparent;
        box-shadow: inherit;
      }

      #stars2 {
        width: 2px;
        height: 2px;
        background: transparent;
        box-shadow: 500px 1000px #fff, 1400px 700px #fff, 300px 300px #fff,
          1700px 1200px #fff, 800px 1600px #fff, 1900px 400px #fff;
        animation: animStar 100s linear infinite;
      }
      #stars2:after {
        content: " ";
        position: absolute;
        top: 2000px;
        width: 2px;
        height: 2px;
        background: transparent;
        box-shadow: inherit;
      }

      #stars3 {
        width: 3px;
        height: 3px;
        background: transparent;
        box-shadow: 600px 1500px #fff, 1300px 500px #fff, 400px 1800px #fff,
          1700px 900px #fff, 1000px 300px #fff;
        animation: animStar 150s linear infinite;
      }
      #stars3:after {
        content: " ";
        position: absolute;
        top: 2000px;
        width: 3px;
        height: 3px;
        background: transparent;
        box-shadow: inherit;
      }

      @keyframes animStar {
        from {
          transform: translateY(0px);
        }
        to {
          transform: translateY(-2000px);
        }
      }

      /* SPHERES */
      .container {
        display: flex;
        gap: 2rem;
        position: relative;
        z-index: 10;
      }

      .sphere {
        width: 150px;
        height: 150px;
        cursor: pointer;
        position: relative;
        transition: transform 0.2s ease;
      }

      .sphere:hover {
        transform: scale(1.1);
      }

      .sphere img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        display: block;
      }

      .tooltip {
        visibility: hidden;
        opacity: 0;
        width: 220px;
        background-color: rgba(0, 0, 0, 0.85);
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 8px;
        position: absolute;
        bottom: 110%;
        left: 50%;
        transform: translateX(-50%);
        transition: opacity 0.3s ease;
        font-size: 0.85rem;
        pointer-events: none;
        z-index: 20;
        font-family: "HelveticaNeue65Medium", sans-serif;
      }

      .sphere:hover .tooltip {
        visibility: visible;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- STAR LAYERS -->
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <!-- SPHERES -->
    <div class="container" id="sphere-container"></div>

    <!-- BACKGROUND MUSIC -->
    <audio
      id="bg-music"
      src="audio/my-castle-town.mp3"
      loop
    ></audio>

    <script>
      // Spheres
      const spheres = [
        {
          img: "images/micrdev.gif",
          url: "https://micr.dev/",
          desc: "A 3D interactable portfolio. Needs WebGL and hardware acceleration enabled.",
        },
        {
          img: "images/micrdevabout.gif",
          url: "https://micr.dev/about/",
          desc: "A place to learn a bit more of me.",
        },
        {
          img: "images/micrdevmicrokeebs.gif",
          url: "https://micr.dev/microkeebs/",
          desc: "A website to showcase keyboards that I have built.",
        },
        {
          img: "images/micrdevquarzite.gif",
          url: "https://micr.dev/quarzite/",
          desc: "A dedicated page for my character.",
        },
      ];

      const container = document.getElementById("sphere-container");

      spheres.forEach((sphere) => {
        const div = document.createElement("div");
        div.className = "sphere";
        div.innerHTML = `
          <img src="${sphere.img}" alt="sphere" />
          <div class="tooltip">${sphere.desc}</div>
        `;
        div.addEventListener("click", () => {
          window.location.href = sphere.url;
        });
        container.appendChild(div);
      });

      // Background music
      const audio = document.getElementById("bg-music");
      audio.volume = 0.25; // 25% volume
      audio.play().catch(() => {
        console.log("Autoplay blocked. Waiting for user interaction.");
      });

      // Fallback: play on first user interaction if autoplay is blocked
      document.body.addEventListener("click", () => {
        if (audio.paused) {
          audio.play();
        }
      });
    </script>
  </body>
</html>
