<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Quarzite</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/icons/windows_slanted-1.png" />

    <!-- 98.css (Shared Library) -->
    <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.20/dist/98.css" />

    <!-- ==================================================================
         DEVICE DETECTION & LOADER
         ================================================================== -->
    <script>
      (function() {
        // 1. Detect Mobile
        var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        
        // 2. Inject the correct CSS immediately (prevents FOUC)
        var cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.href = isMobile ? 'css/mobile.css' : 'css/main.css';
        document.head.appendChild(cssLink);

        // 3. Main Logic (Runs when DOM is ready)
        window.addEventListener('DOMContentLoaded', function() {
          // A. Clone the correct HTML template into the body
          var tplId = isMobile ? 'tpl-mobile' : 'tpl-desktop';
          var template = document.getElementById(tplId);
          var content = template.content.cloneNode(true);
          document.body.appendChild(content);

          // B. Define scripts for each mode
          var scripts = [];
          if (isMobile) {
            console.log("Mobile mode active.");
            scripts = [
              'js/mobile-sounds.js', 
              'js/mobile-tabs.js', 
              'js/mobile-gallery.js', 
              'js/mobile-viewer.js'
            ];
          } else {
            console.log("Desktop mode active.");
            scripts = [
              'js/run.js', 'js/drag.js', 'js/tabs.js', 'js/warning.js', 
              'js/debug.js', 'js/clippy.js', 'js/notepad.js', 'js/gallery.js', 
              'js/app.js', 'js/tiles.js', 'js/controls.js', 'js/sounds.js', 
              'js/res-warning.js'
            ];
            
            // Load Oneko (Desktop Only)
            var cat = document.createElement('script');
            cat.src = "https://sleepie.uk/oneko.js";
            cat.async = true;
            document.head.appendChild(cat);
          }

          // C. Load scripts sequentially to ensure order
          function loadScripts(list) {
            if (list.length === 0) return;
            var s = document.createElement('script');
            s.src = list[0];
            s.onload = function() { loadScripts(list.slice(1)); };
            document.body.appendChild(s);
          }
          loadScripts(scripts);

          // D. Initialize Logo (Works for both modes)
          var logos = ["assets/quarzitelogo3.gif", "assets/quarzitelogo4.gif"];
          var randLogo = logos[Math.floor(Math.random() * logos.length)];
          var logoEl = document.getElementById('logo-img');
          
          if (logoEl) {
            if (logoEl.tagName === 'IMG') {
               // Desktop uses <img>
               logoEl.src = randLogo;
            } else {
               // Mobile uses <div> with background
               logoEl.style.backgroundImage = 'url("' + randLogo + '")';
            }
          }
        });
      })();
    </script>
  </head>

  <body>
    <!-- 
      The body is empty by default! 
      The script above will inject ONE of the templates below. 
    -->

    <!-- ==================================================================
         TEMPLATE: DESKTOP (Original PC Interface)
         ================================================================== -->
    <template id="tpl-desktop">
      <div class="desktop" id="desktop">
        <!-- Logo container -->
        <div class="logo" id="logo-container" aria-label="Quarzite Logo">
          <img id="logo-img" class="logo-img" alt="Quarzite Logo" />
        </div>

        <!-- Easter Egg -->
        <img id="easter-egg-tree" src="assets/tree.webp" alt="Tree" hidden
          style="position: absolute; left: 480px; top: 480px; width: 120px; height: auto; z-index: 1; cursor: pointer;" />

        <!-- Gallery window -->
        <div class="window app-window resizable" id="win-gallery" data-title="Gallery">
          <div class="title-bar">
            <div class="title-bar-text">
              <img src="assets/icons/directory_closed-4.png" class="title-icon" alt="" />
              <span class="title-label">Gallery</span>
            </div>
            <div class="title-bar-controls">
              <button aria-label="Minimize"></button><button aria-label="Maximize"></button><button aria-label="Close"></button>
            </div>
          </div>
          <div class="window-body" style="overflow: auto; padding: 8px">
            <div id="gallery-strip" class="gallery-strip"></div>
          </div>
        </div>

        <!-- Info window -->
        <div class="window app-window resizable" id="win-info" data-title="Info">
          <div class="title-bar">
            <div class="title-bar-text">
              <img src="assets/icons/display_properties-2.png" class="title-icon" alt="" />
              <span class="title-label">Information</span>
            </div>
            <div class="title-bar-controls">
              <button aria-label="Minimize"></button><button aria-label="Maximize"></button><button aria-label="Close"></button>
            </div>
          </div>
          <div class="window-body info-tabs">
            <menu role="tablist" class="tabs-menu">
              <li role="tab" aria-selected="true"><a href="#intro">Intro</a></li>
              <li role="tab"><a href="#appearance">Appearance</a></li>
              <li role="tab"><a href="#personality">Personality</a></li>
              <li role="tab"><a href="#extra">Extra</a></li>
            </menu>
            <div class="window" role="tabpanel" id="intro">
              <div class="window-body">
                <p>Welcome to the webpage dedicated to my original character/sona, Quarzite. Here you’ll find more information about them, along with art and other commissions I’ve collected over the years.</p>
                <p>I don’t really care what pronouns you use for them (as you’ve probably noticed, I’ve been using they/them, but honestly I cba). Their design is purposefully androgynous, aside from the clothing.</p>
                <p>I actually came up with the name for them not too long ago, but I completely forgot the history behind it. It was really cool, but oh well it is what it is.</p>
              </div>
            </div>
            <div class="window" role="tabpanel" id="appearance" hidden>
              <div class="window-body">
                <p>They have a wolf/jellyfish-style haircut: white hair with lavender shading at the tips and along the lower half. Prominent black, devil-like horns with cross markings stand out on the sides of their head.</p>
                <p>Their outfit usually consists of a black-and-white oversized hoodie with long sleeves featuring crisscross stitching and lacing. They pair this with thigh-high socks and leg accessories like straps or garters.</p>
                <p>Originally, their very long hair was sometimes interpreted by artists as a tail. While that wasn’t intentional, it’s been fun to see in retrospect.</p>
                <p>I’ve thought about changing their outfit, but I feel like the hoodie really fits the vibe it gives off.</p>
              </div>
            </div>
            <div class="window" role="tabpanel" id="personality" hidden>
              <div class="window-body">
                <p>I honestly never thought too deeply about it, since the character is kind of just me, so there’s no real reason to write out a personality.</p>
                <p>One thing I do enjoy, though, is giving full creative freedom to the artist and seeing how they interpret it based on past artworks.</p>
              </div>
            </div>
            <div class="window" role="tabpanel" id="extra" hidden>
              <div class="window-body">
                <p>I’m not really a furry (although I do have some kind of fursona), but I fw them a lot.</p>
                <p>Lastly, if you like my character and feel like drawing them, go for it! You can send it to <b>contact@micr.dev</b>, or just drop it in my socials.</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Clippy -->
        <div class="window app-window" id="win-clippy" data-title="Clippy" hidden>
          <div class="title-bar">
            <div class="title-bar-text">
              <img src="assets/icons/computer_explorer-0.png" class="title-icon" alt="" />
              <span class="title-label">Clippy</span>
            </div>
            <div class="title-bar-controls">
              <button aria-label="Minimize"></button><button aria-label="Maximize"></button><button aria-label="Close"></button>
            </div>
          </div>
          <div class="window-body">
            <div id="clippy-wrapper">
              <div class="speech-bubble"><div id="text"></div></div>
              <div id="clippy"></div>
            </div>
          </div>
        </div>

        <!-- Notepad -->
        <div class="window app-window resizable" id="win-notepad" data-title="Notepad" hidden>
          <div class="title-bar">
            <div class="title-bar-text">
              <img src="assets/icons/notepad-1.png" class="title-icon" alt="" />
              <span class="title-label">Notepad</span>
            </div>
            <div class="title-bar-controls">
              <button aria-label="Minimize"></button><button aria-label="Maximize"></button><button aria-label="Close"></button>
            </div>
          </div>
          <menu role="menubar" class="notepad-menu">
            <li role="menuitem"><u>F</u>ile</li>
            <li role="menuitem"><u>E</u>dit</li>
            <li role="menuitem"><u>S</u>earch</li>
            <li role="menuitem"><u>H</u>elp</li>
          </menu>
          <div class="window-body notepad-body">
            <textarea id="notepad-text" class="notepad-wrap"></textarea>
          </div>
        </div>

        <!-- Paint -->
        <div class="window app-window resizable" id="win-paint" data-title="Paint" hidden>
          <div class="title-bar">
            <div class="title-bar-text">
              <img src="assets/icons/paint_file-1.png" class="title-icon" alt="" />
              <span class="title-label">Paint</span>
            </div>
            <div class="title-bar-controls">
              <button aria-label="Minimize"></button><button aria-label="Maximize"></button><button aria-label="Close"></button>
            </div>
          </div>
          <div class="window-body paint-body">
            <iframe src="jspaint/index.html" class="paint-frame" title="MS Paint"></iframe>
          </div>
        </div>

        <!-- Viewer -->
        <div class="window app-window" id="win-viewer" data-title="Viewer" hidden>
          <div class="title-bar">
            <div class="title-bar-text">
              <img src="assets/icons/favicon-96x96.png" class="title-icon" alt="" />
              <span class="title-label">Image Viewer</span>
            </div>
            <div class="title-bar-controls">
              <button aria-label="Minimize"></button><button aria-label="Maximize"></button><button aria-label="Close"></button>
            </div>
          </div>
          <div class="window-body viewer-body">
            <figure class="viewer-figure">
              <img id="viewer-img" alt="" />
            </figure>
            <div class="viewer-meta" id="viewer-meta"></div>
            <div class="viewer-desc" id="viewer-desc" hidden></div>
          </div>
        </div>

        <!-- Modals -->
        <div id="warning-backdrop" hidden></div>
        <div class="window modal" id="warning" role="dialog" aria-modal="true" hidden>
          <div class="title-bar">
            <div class="title-bar-text"><span class="title-label">Warning</span></div>
            <div class="title-bar-controls"><button aria-label="Close"></button></div>
          </div>
          <div class="window-body">
            <div class="field-row warning-row">
              <img src="assets/icons/msg_error-0.png" alt="Error" width="32" height="32" />
              <div id="warning-message">You can move windows; but minimizing, maximizing or closing isn’t allowed.</div>
            </div>
            <div class="field-row" style="justify-content: flex-end">
              <button id="warning-ok" class="default">OK</button>
            </div>
          </div>
        </div>

        <div id="res-warning-backdrop" hidden></div>
        <div class="window modal" id="res-warning" role="dialog" aria-modal="true" hidden>
          <div class="title-bar">
            <div class="title-bar-text"><span class="title-label">Compatibility Notice</span></div>
            <div class="title-bar-controls"><button aria-label="Close"></button></div>
          </div>
          <div class="window-body">
            <div class="field-row warning-row">
              <img src="assets/icons/msg_error-0.png" alt="Warning" width="32" height="32" />
              <div>
                <div id="res-warning-message">Incompatible resolution detected.</div>
                <div style="margin-top: 6px; opacity: 0.8">Current viewport: <span id="res-current"></span></div>
              </div>
            </div>
            <div class="field-row">
              <input type="checkbox" id="res-dont-remind" />
              <label for="res-dont-remind">Don't remind me again</label>
            </div>
            <div class="field-row" style="justify-content: flex-end">
              <button id="res-accept" class="default">OK</button>
            </div>
          </div>
        </div>

        <!-- Control buttons -->
        <div id="control-buttons">
          <button id="tile-toggle" class="control-btn"><img src="assets/icons/filepack-1.png" alt="Change Background" /></button>
          <button id="volume-toggle" class="control-btn"><img id="volume-icon" src="assets/icons/loudspeaker_rays-0.png" alt="Volume" /></button>
          <button id="anim-toggle" class="control-btn"><img src="assets/icons/gears_tweakui_a-1.png" alt="Toggle Animations" /></button>
        </div>
        <div id="volume-popup" class="window" hidden>
          <div class="window-body"><input type="range" id="volume-slider" min="0" max="100" /></div>
        </div>
      </div>
    </template>

    <!-- ==================================================================
         TEMPLATE: MOBILE (Phone/Tablet Interface)
         ================================================================== -->
    <template id="tpl-mobile">
      <!-- Animated tiled background -->
      <div class="bg-tiles" aria-hidden="true"></div>

      <!-- Mobile Logo -->
      <div id="logo-container" aria-label="Quarzite Logo">
        <div id="logo-img" class="logo-img" role="img"></div>
      </div>

      <div class="mobile-container">
        <!-- Top-level nav (tabs) -->
        <div class="window mobile-window">
          <div class="title-bar">
            <div class="title-bar-text">
              <img src="assets/icons/filepack-1.png" class="title-icon" alt="" /> Navigation
            </div>
          </div>
          <div class="window-body">
            <div class="tab-nav" role="tablist" aria-label="Main sections">
              <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="tab-gallery" id="tabbtn-gallery" data-tab="gallery">
                <img src="assets/icons/directory_closed-4.png" alt="" /> Gallery
              </button>
              <button class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-info" id="tabbtn-info" data-tab="info">
                <img src="assets/icons/display_properties-2.png" alt="" /> Info
              </button>
            </div>
          </div>
        </div>

        <!-- Gallery Tab -->
        <div class="tab-content active" id="tab-gallery" role="tabpanel" aria-labelledby="tabbtn-gallery">
          <div class="window mobile-window">
            <div class="title-bar">
              <div class="title-bar-text">
                <img src="assets/icons/directory_closed-4.png" class="title-icon" alt="" /> Gallery
              </div>
            </div>
            <div class="window-body">
              <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>
            </div>
          </div>
        </div>

        <!-- Info Tab -->
        <div class="tab-content" id="tab-info" role="tabpanel" aria-labelledby="tabbtn-info">
          <div class="window mobile-window">
            <div class="title-bar">
              <div class="title-bar-text">
                <img src="assets/icons/display_properties-2.png" class="title-icon" alt="" /> Information
              </div>
            </div>
            <div class="window-body info-tabs">
              <menu role="tablist" class="tabs-menu">
                <li role="tab" aria-selected="true"><a href="#intro">Intro</a></li>
                <li role="tab"><a href="#appearance">Appearance</a></li>
                <li role="tab"><a href="#personality">Personality</a></li>
                <li role="tab"><a href="#extra">Extra</a></li>
              </menu>

              <div class="window" role="tabpanel" id="intro">
                <div class="window-body">
                  <p>Welcome to the webpage dedicated to my original character/sona, Quarzite. Here you’ll find more information about them, along with art and other commissions I’ve collected over the years.</p>
                  <p>I don’t really care what pronouns you use for them (as you’ve probably noticed, I’ve been using they/them, but honestly I cba). Their design is purposefully androgynous, aside from the clothing.</p>
                  <p>I actually came up with the name for them not too long ago, but I completely forgot the history behind it. It was really cool, but oh well it is what it is.</p>
                </div>
              </div>

              <div class="window" role="tabpanel" id="appearance" hidden>
                <div class="window-body">
                  <p>They have a wolf/jellyfish-style haircut: white hair with lavender shading at the tips and along the lower half. Prominent black, devil-like horns with cross markings stand out on the sides of their head. Their long bangs partly cover tired, baggy eyes, usually a pinkish-red color, sometimes with heart-shaped pupils. They often have a relaxed & friendly smile, though their sharp teeth serve as a subtle warning.</p>
                  <p>Their outfit usually consists of a black-and-white oversized hoodie with long sleeves featuring crisscross stitching and lacing. They pair this with thigh-high socks and leg accessories like straps or garters. Their go-to footwear is winged sneakers, though in some artworks they’re drawn wearing New Rocks instead.</p>
                  <p>Originally, their very long hair was sometimes interpreted by artists as a tail. While that wasn’t intentional, it’s been fun to see in retrospect (though nowadays I prefer commissioning them without the tail/extra-long hair). In earlier artworks, they were often accompanied by little ghost companions, but I’ve since stopped including them since I feel they clutter the design.</p>
                  <p>I’ve thought about changing their outfit, but I feel like the hoodie really fits the vibe it gives off. I’d love to add some facial piercings (like a lip piercing, an eyebrow piercing, or even an anti-eyebrow) but I’m not sure how different artists would interpret them, so I’ve decided to set that idea aside for now.</p>
                </div>
              </div>

              <div class="window" role="tabpanel" id="personality" hidden>
                <div class="window-body">
                  <p>I honestly never thought too deeply about it, since the character is kind of just me, so there’s no real reason to write out a personality.</p>
                  <p>One thing I do enjoy, though, is giving full creative freedom to the artist and seeing how they interpret it based on past artworks. It’s always interesting to see the final result, knowing the artist built a personality from scratch just from the vibes they picked up. There is a different interpretation of Quarzite’s character in each artist that has drawn it.</p>
                </div>
              </div>

              <div class="window" role="tabpanel" id="extra" hidden>
                <div class="window-body">
                  <p>I’m not really a furry (although I do have some kind of fursona), but I fw them a lot. So even though I don’t have a Quarzite-inspired fursona right now, I could totally see myself making one in the future. It sounds like a fun thing to do!</p>
                  <p>Lastly, if you like my character and feel like drawing them, go for it! I’d be so happy to see any kind of art, memes, or whatever you come up with. You can send it to me at <b>contact@micr.dev</b>, or just drop it in my socials. If I don’t reply, it probably got eaten by a spam filter or something like that, so don’t stress about tagging me or trying again. I promise I’ll appreciate it a ton.</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Mobile Viewer modal -->
        <div id="viewer-backdrop" hidden></div>
        <div class="window viewer-window" id="viewer-modal" hidden>
          <div class="title-bar">
            <div class="title-bar-text">
              <img src="assets/icons/favicon-96x96.png" class="title-icon" alt="" />
              <span id="viewer-title">Image Viewer</span>
            </div>
            <div class="title-bar-controls">
              <button id="viewer-close" aria-label="Close"></button>
            </div>
          </div>
          <div class="window-body">
            <figure class="viewer-figure">
              <img id="viewer-img" alt="" />
            </figure>
            <div id="viewer-meta" class="viewer-meta"></div>
            <div id="viewer-desc" class="viewer-desc" hidden></div>
          </div>
        </div>
      </div>
    </template>
  </body>
</html>
