<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0E15AE;
            color: #FFFFFF;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .header-box {
            background-color: #C0C0C0;
            color: #0E15AE;
            padding: 2px 8px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .content {
            text-align: center;
            max-width: 90%;
        }
        
        .left-align {
            text-align: left;
        }
        
        .error-text {
            margin-bottom: 20px;
        }
        
        .instruction-text {
            margin-bottom: 15px;
        }
        
        .error-code {
            margin-top: 30px;
            margin-bottom: 40px;
        }
        
        .continue-text {
            text-align: center;
            margin-top: 20px;
        }
        
        .blink {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="header-box">Error</div>
        
        <div class="error-text left-align">
            A mobile compatibility error has occurred. To continue:
        </div>
        
        <div class="instruction-text left-align">
            Please switch to a PC or Desktop computer.
        </div>
        
        <div class="error-code left-align">
            Error: 0E : 016F : BFF9B3D4
        </div>
        
        <div class="continue-text left-align">
            Don't press any key to continue <span class="blink">_</span>
        </div>
    </div>
</body>
</html>
