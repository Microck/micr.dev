<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tree</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <style>
      @font-face {
        font-family: "HelveticaNeue65Medium";
        src: url("fonts/Helvetica Neue 65 Medium.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(
          ellipse at bottom,
          #1b2735 0%,
          #090a0f 100%
        );
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
      }

      /* STAR BACKGROUND */
      #stars,
      #stars2,
      #stars3 {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: block;
      }

      #stars {
        width: 1px;
        height: 1px;
        background: transparent;
        box-shadow: 1234px 456px #fff, 789px 1234px #fff, 1500px 800px #fff,
          300px 1900px #fff, 1800px 300px #fff, 400px 600px #fff,
          1600px 1700px #fff, 900px 1400px #fff, 1200px 200px #fff;
        animation: animStar 50s linear infinite;
      }
      #stars:after {
        content: " ";
        position: absolute;
        top: 2000px;
        width: 1px;
        height: 1px;
        background: transparent;
        box-shadow: inherit;
      }

      #stars2 {
        width: 2px;
        height: 2px;
        background: transparent;
        box-shadow: 500px 1000px #fff, 1400px 700px #fff, 300px 300px #fff,
          1700px 1200px #fff, 800px 1600px #fff, 1900px 400px #fff;
        animation: animStar 100s linear infinite;
      }
      #stars2:after {
        content: " ";
        position: absolute;
        top: 2000px;
        width: 2px;
        height: 2px;
        background: transparent;
        box-shadow: inherit;
      }

      #stars3 {
        width: 3px;
        height: 3px;
        background: transparent;
        box-shadow: 600px 1500px #fff, 1300px 500px #fff, 400px 1800px #fff,
          1700px 900px #fff, 1000px 300px #fff;
        animation: animStar 150s linear infinite;
      }
      #stars3:after {
        content: " ";
        position: absolute;
        top: 2000px;
        width: 3px;
        height: 3px;
        background: transparent;
        box-shadow: inherit;
      }

      @keyframes animStar {
        from {
          transform: translateY(0px);
        }
        to {
          transform: translateY(-2000px);
        }
      }

      /* SPHERES */
      .container {
        display: flex;
        gap: 2rem;
        position: relative;
        z-index: 10;
        flex-wrap: wrap;
        justify-content: center;
      }

      .sphere {
        width: 150px;
        height: 150px;
        cursor: pointer;
        position: relative;
        transition: transform 0.2s ease;
      }

      .sphere img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        display: block;
      }

      /* Desktop hover zoom */
      @media (hover: hover) and (pointer: fine) {
        .sphere:hover {
          transform: scale(1.1);
        }
      }

      /* Mobile active zoom */
      @media (hover: none) and (pointer: coarse) {
        .sphere.active {
          transform: scale(1.1);
        }
      }

      /* Desktop tooltip */
      .tooltip {
        visibility: hidden;
        opacity: 0;
        width: 220px;
        background-color: rgba(0, 0, 0, 0.85);
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 8px;
        position: absolute;
        bottom: 110%;
        left: 50%;
        transform: translateX(-50%);
        transition: opacity 0.3s ease;
        font-size: 0.85rem;
        pointer-events: none;
        z-index: 20;
        font-family: "HelveticaNeue65Medium", sans-serif;
      }

      .sphere:hover .tooltip {
        visibility: visible;
        opacity: 1;
      }

      /* Mobile description box */
      #mobile-desc {
        display: none;
        margin-top: 1rem;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 10px 14px;
        border-radius: 8px;
        max-width: 90%;
        text-align: center;
        font-size: 0.9rem;
        font-family: "HelveticaNeue65Medium", sans-serif;
        z-index: 50;
      }

      @media (max-width: 600px) {
        .sphere {
          width: 40vw;
          height: 40vw;
          max-width: 150px;
          max-height: 150px;
        }

        .tooltip {
          display: none; /* hide floating tooltips on mobile */
        }

        /* Denser stars on mobile */
        #stars {
          box-shadow: 1234px 456px #fff, 789px 1234px #fff, 1500px 800px #fff,
            300px 1900px #fff, 1800px 300px #fff, 400px 600px #fff,
            1600px 1700px #fff, 900px 1400px #fff, 1200px 200px #fff,
            200px 800px #fff, 600px 1200px #fff, 1000px 1600px #fff,
            400px 400px #fff, 800px 200px #fff, 1500px 1500px #fff,
            300px 700px #fff, 700px 1800px #fff, 1700px 400px #fff;
        }
        #stars2 {
          box-shadow: 500px 1000px #fff, 1400px 700px #fff, 300px 300px #fff,
            1700px 1200px #fff, 800px 1600px #fff, 1900px 400px #fff,
            200px 1500px #fff, 1000px 500px #fff, 600px 1800px #fff,
            400px 900px #fff, 1200px 1300px #fff, 1600px 600px #fff;
        }
        #stars3 {
          box-shadow: 600px 1500px #fff, 1300px 500px #fff, 400px 1800px #fff,
            1700px 900px #fff, 1000px 300px #fff, 800px 1200px #fff,
            500px 700px #fff, 1200px 1600px #fff, 1400px 1400px #fff;
        }
      }
    </style>
  </head>
  <body>
    <!-- STAR LAYERS -->
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <!-- SPHERES -->
    <div class="container" id="sphere-container"></div>

    <!-- MOBILE DESCRIPTION BOX -->
    <div id="mobile-desc"></div>

    <!-- BACKGROUND MUSIC -->
    <audio
      id="bg-music"
      src="audio/my-castle-town.mp3"
      loop
      playsinline
    ></audio>

    <script>
      const spheres = [
        {
          img: "images/micrdev.gif",
          url: "https://micr.dev/",
          desc: "A 3D interactable portfolio. Needs WebGL and hardware acceleration enabled.",
        },
        {
          img: "images/micrdevabout.gif",
          url: "https://micr.dev/about/",
          desc: "A place to learn a bit more of me.",
        },
        {
          img: "images/micrdevmicrokeebs.gif",
          url: "https://micr.dev/microkeebs/",
          desc: "A website to showcase keyboards that I have built.",
        },
        {
          img: "images/micrdevquarzite.gif",
          url: "https://micr.dev/quarzite/",
          desc: "A dedicated page for my character.",
        },
      ];

      const container = document.getElementById("sphere-container");
      const mobileDesc = document.getElementById("mobile-desc");
      const isMobile = window.matchMedia("(pointer: coarse)").matches;

      let activeSphere = null;

      spheres.forEach((sphere) => {
        const div = document.createElement("div");
        div.className = "sphere";
        div.innerHTML = `
          <img src="${sphere.img}" alt="sphere" />
          <div class="tooltip">${sphere.desc}</div>
        `;

        if (isMobile) {
          div.addEventListener("click", (e) => {
            e.stopPropagation();
            if (activeSphere === div) {
              // second tap → go to link
              window.location.href = sphere.url;
            } else {
              // first tap → show description
              if (activeSphere) activeSphere.classList.remove("active");
              activeSphere = div;
              div.classList.add("active");
              mobileDesc.textContent = sphere.desc;
              mobileDesc.style.display = "block";
            }
          });
        } else {
          // Desktop: single click
          div.addEventListener("click", () => {
            window.location.href = sphere.url;
          });
        }

        container.appendChild(div);
      });

      if (isMobile) {
        // Tap outside clears selection
        document.body.addEventListener("click", () => {
          if (activeSphere) {
            activeSphere.classList.remove("active");
            activeSphere = null;
            mobileDesc.style.display = "none";
          }
        });
      }

      // Background music
      const audio = document.getElementById("bg-music");
      audio.volume = 0.25;

      // Play on first click/tap anywhere
      const enableAudio = () => {
        if (audio.paused) {
          audio.play().catch((err) => {
            console.log("Audio play failed:", err);
          });
        }
        document.removeEventListener("click", enableAudio);
        document.removeEventListener("touchstart", enableAudio);
      };
      document.addEventListener("click", enableAudio);
      document.addEventListener("touchstart", enableAudio);
    </script>
  </body>
</html>
